openapi: 3.0.3
info:
  title: Mattermost Endpoints
  version: 1.0.0

paths:
  /service/show-birthday-dialog-window:
    post:
      summary: Handle Open Dialog window for birthday poll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenBirthdayWindow'
      responses:
        '200':
          description: OK

  /service/save-birthday:
    post:
      summary: Handle Saving birthday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandleSavingBirthday'
      responses:
        '200':
          description: OK

components:
  schemas:
    OpenBirthdayWindow:
      type: object
      required:
        - trigger_id
        - user_id
        - channel_id
      properties:
        trigger_id:
          type: string
        user_id:
          type: string
        channel_id:
          type: string
        team_id:
          type: string
        context:
          type: object
          additionalProperties: true

    HandleSavingBirthday:
      type: object
      required:
        - type
        - user_id
        - submission
      properties:
        type:
          type: string
          example: dialog_submission
        callback_id:
          type: string
        user_id:
          type: string
        channel_id:
          type: string
        team_id:
          type: string
        submission:
          type: object
          required:
            - day
            - month
          properties:
            day:
              type: string
            month:
              type: string
            year:
              type: string
        state:
          type: string